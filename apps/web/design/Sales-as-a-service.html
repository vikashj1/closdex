<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SalesArena — User Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.985 0.004 80);
    --bg-2: oklch(0.965 0.006 80);
    --surface: oklch(1 0 0);
    --surface-2: oklch(0.945 0.007 80);
    --surface-3: oklch(0.905 0.008 80);
    --border: oklch(0.86 0.008 80);
    --border-soft: oklch(0.92 0.007 80);
    --text: oklch(0.22 0.012 75);
    --text-dim: oklch(0.45 0.012 75);
    --text-mute: oklch(0.6 0.011 75);

    --gold:   oklch(0.66 0.16 75);
    --gold-2: oklch(0.58 0.17 60);
    --fire:   oklch(0.6 0.18 35);
    --cool:   oklch(0.52 0.18 240);
    --emerald: oklch(0.55 0.14 150);

    /* difficulty */
    --d-rookie: oklch(0.58 0.16 145);
    --d-easy:   oklch(0.62 0.17 130);
    --d-medium: oklch(0.68 0.16 80);
    --d-hard:   oklch(0.62 0.19 50);
    --d-expert: oklch(0.55 0.21 28);

    /* rank metals */
    --r-rookie: oklch(0.55 0.01 80);
    --r-bronze: oklch(0.55 0.13 50);
    --r-silver: oklch(0.6 0.01 80);
    --r-gold:   oklch(0.65 0.17 80);
    --r-platinum: oklch(0.65 0.06 215);
    --r-diamond: oklch(0.55 0.14 210);
    --r-master: oklch(0.5 0.22 305);
    --r-gm:     oklch(0.55 0.22 20);

    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 18px;

    --shadow-sm: 0 1px 2px rgba(30, 22, 10, 0.05), 0 0 0 1px rgba(30, 22, 10, 0.02);
    --shadow-md: 0 8px 28px rgba(30, 22, 10, 0.08), 0 1px 3px rgba(30, 22, 10, 0.04);
    --shadow-glow: 0 0 0 1px oklch(0.66 0.16 75 / 0.4), 0 8px 32px oklch(0.66 0.16 75 / 0.18);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: "DM Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  ::selection { background: var(--gold); color: black; }

  .display { font-family: "Space Grotesk", system-ui, sans-serif; letter-spacing: -0.02em; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--surface-3); }

  /* base anim */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-3px); opacity: 1; } }

  #root { min-height: 100vh; }

  /* Stripe placeholder util */
  .stripe-ph {
    background-image: repeating-linear-gradient(135deg, var(--surface-2) 0 8px, var(--surface) 8px 16px);
  }

  /* Buttons / inputs base */
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; color: inherit; background: transparent; border: none; outline: none; }
</style>
</head>
<body>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="ui.jsx" data-presets="react"></script>
