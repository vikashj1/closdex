services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: closdex
      POSTGRES_PASSWORD: closdex
      POSTGRES_DB: closdex
    ports:
      - "5432:5432"
    volumes:
      - closdex_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closdex"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - closdex_redis:/data

volumes:
  closdex_pg:
  closdex_redis:
